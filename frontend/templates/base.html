<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blueprint{% endblock %}</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container">
      <nav class="sidebar"> <!-- Sidebar Div -->
          <div class="top">
            <div class="logo">
              <i class="bx bx-clipboard"></i>  <!-- Icon --> 
              <span>Blueprint</span> <!-- Logo Text -->
            </div>
            <i class="bx bx-menu" id="btn"></i> <!-- Menu Icon "Three Lines" --> 
          </div>
          <div class="user">
            <img src="" alt="me" class="user-img"> <!-- User Image, Eventually need to let user edit these -->
            <div>
              <p class="bold">Kawal</p> <!-- User Name -->
              <p>Faculty</p>
            </div>
          </div>
        <ul> <!-- Sidebar Menu Start of Items and such on left and hovers, first span are icons title and second span is hover -->
          <li>
            <a href="{{ url_for('index') }}"> 
              <i class="bx bx-home"></i>
              <span class="nav-item">Home</span>
            </a>
            <span class="tooltip">Home</span>
          </li>
          <li>
            <a href="#"> 
              <i class="bx bx-calculator"></i>
              <span class="nav-item">Semester Calculator</span>
            </a>
            <span class="tooltip">Semester Calculator</span>
          </li>
          <li>
            <a href="#"> 
              <i class="bx bx-comment-check"></i>
              <span class="nav-item">Your Reviews</span>
            </a>
            <span class="tooltip">Your Reviews</span>
          </li>
          <li>
            <a href="{{ url_for('about') }}"> 
              <i class="bx bxs-info-square"></i>
              <span class="nav-item">About</span>
            </a>
            <span class="tooltip">About</span>
          </li>
          </li>
            <li>
            <a href="{{ url_for('help') }}"> 
              <i class='bx bx-help-circle'></i> 
              <span class="nav-item">Help / Guides</span>
            </a>
            <span class="tooltip">Help / Guides</span>
          </li>
          <li>
            <a href="#"> 
              <i class="bx bx-cog"></i>
              <span class="nav-item">Settings</span>
            </a>
            <span class="tooltip">Settings</span>
          </li>
          <li>
            <a href="#"> 
              <i class="bx bxs-log-out"></i>
              <span class="nav-item">Logout</span>
            </a>
            <span class="tooltip">Logout</span>
          </li>
        </ul>
      </nav>
      <!-- Script for nav bar. -->
      <script>
        let btn = document.querySelector('#btn') /*Selects the menu button*/
        let sidebar = document.querySelector('.sidebar') /*Selects the sidebar*/

        btn.onclick = function() { /*When the button is clicked*/
          sidebar.classList.toggle('active') /*Toggle the active class on the sidebar*/
        } /*End of function*/
      </script>
      <!-- Place for other files to add their body content after inheriting this template. -->
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
